services:
  modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: apisentry_modsec_baseline
    ports:
      - "8081:8080"
    environment:
      BACKEND: "http://host.docker.internal:8000"
      PROXY_SSL: "off"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
    extra_hosts:
      - "host.docker.internal:host-gateway"
